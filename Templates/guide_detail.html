{% extends 'header_footer.html' %}
{% block base %}

<main class="pt-20 bg-gray-50 min-h-screen">

<section class="max-w-6xl mx-auto px-4 py-12 grid md:grid-cols-2 gap-10">

    <!-- GUIDE IMAGE -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        {% if guide.image %}
        <img src="{{ guide.image.url }}" class="w-full h-96 object-cover">
        {% else %}
        <img src="https://via.placeholder.com/600x400" class="w-full h-96 object-cover">
        {% endif %}

        <div class="p-6">

            <h1 class="text-2xl font-bold">
                {{ guide.name }}
            </h1>

            <p class="text-emerald-600 text-sm mt-1">
                {{ guide.get_specialty_display }}
            </p>

            <p class="text-gray-600 mt-4">
                {{ guide.bio }}
            </p>

        </div>
    </div>

    <!-- INFO + BOOK -->
    <div class="bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-xl font-bold mb-6">
            Guide Details
        </h2>

        <div class="space-y-4 text-sm">

            <p><span class="font-semibold">Experience:</span> {{ guide.experience }} years</p>

            <p><span class="font-semibold">Location:</span> {{ guide.get_location_display }}</p>

        </div>

        <!-- BOOK BUTTON -->
        <a href="{% url 'book_guide' guide.id %}">
            <button class="w-full mt-8 bg-emerald-700 text-white py-3 rounded-xl hover:bg-emerald-800 transition">
                Book This Guide
            </button>
        </a>

    </div>

</section>

</main>

{% endblock %}

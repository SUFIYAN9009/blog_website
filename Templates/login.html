{% extends 'header_footer.html' %}

{% block base %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-black to-gray-800 px-4">

    <!-- CARD -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl rounded-2xl p-8">

        <!-- HEADER -->
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-white">Welcome Back</h2>
            <p class="text-gray-300 text-sm mt-2">
                Login to continue your journey 🚀
            </p>
        </div>

        <!-- FORM -->
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            {% for field in form %}

            <div>

                <label class="block text-sm text-gray-300 mb-1">
                    {{ field.label }}
                </label>

                <div class="w-full">
                    {{ field }}
                </div>

                {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">
                    {{ field.errors }}
                </p>
                {% endif %}

            </div>

            {% endfor %}

            <!-- BUTTON -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-600 hover:to-blue-500 text-white font-semibold py-2.5 rounded-lg shadow-lg transition duration-300">
                Login
            </button>

        </form>

        <!-- SIGNUP LINK -->
        <p class="text-center text-sm text-gray-300 mt-6">
            Don’t have an account?
            <a href="{% url 'signup' %}" class="text-blue-400 hover:text-blue-300 font-semibold">
                Sign up
            </a>
        </p>

    </div>

</div>

{% endblock base %}
